[build]
     command = "npm run build"
     publish = "dist"

   [[redirects]]
     from = "/api/ge-prices/mapping"
     to = "/.netlify/functions/ge-prices?endpoint=mapping"
     status = 200

   [[redirects]]
     from = "/api/ge-prices/latest"
     to = "/.netlify/functions/ge-prices?endpoint=latest"
     status = 200

   [[redirects]]
     from = "/api/ge-prices/1h"
     to = "/.netlify/functions/ge-prices?endpoint=1h"
     status = 200

   [[redirects]]
     from = "/api/ge-prices/timeseries"
     to = "/.netlify/functions/ge-prices?endpoint=timeseries"
     status = 200

   [[redirects]]
     from = "/api/*"
     to = "/.netlify/functions/:splat"
     status = 200

   [[headers]]
     for = "/icons/ge/*"
     [headers.values]
       Cache-Control = "public, max-age=31536000, immutable"

   [[headers]]
     for = "/icons/non-ge/*"
     [headers.values]
       Cache-Control = "public, max-age=31536000, immutable"

   [[redirects]]
     from = "/*"
     to = "/index.html"
     status = 200

